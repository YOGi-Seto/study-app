<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StudyTok</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header>
    <div class="header-top">
      <h1>StudyTok</h1>
      <div id="login-area">
        <select id="login-user">
          <option value="">ログイン</option>
        </select>
        <span id="login-name" hidden></span>
        <button id="logout-btn" class="btn-logout" hidden>ログアウト</button>
      </div>
    </div>
    <nav>
      <button class="tab-btn active" data-tab="feed">フィード</button>
      <button class="tab-btn" data-tab="upload">アップロード</button>
      <button class="tab-btn" data-tab="my-videos">マイ動画</button>
      <button class="tab-btn" data-tab="study-room">自習室</button>
    </nav>
  </header>

  <main>
    <!-- フィードタブ -->
    <section id="feed" class="tab-content active">
      <div id="feed-list" class="video-list"></div>
      <button id="load-more" class="btn">もっと見る</button>
      <p id="feed-empty" class="empty-msg" hidden>公開動画はまだありません</p>
    </section>

    <!-- アップロードタブ -->
    <section id="upload" class="tab-content" hidden>
      <form id="upload-form">
        <label>タイトル
          <input type="text" id="upload-title" required placeholder="動画タイトル">
        </label>
        <label>公開範囲
          <select id="upload-visibility">
            <option value="public">公開</option>
            <option value="followers">フォロワーのみ</option>
            <option value="private">非公開</option>
          </select>
        </label>
        <label>動画ファイル
          <input type="file" id="upload-file" accept="video/*" required>
        </label>
        <button type="submit" class="btn btn-primary">アップロード</button>
        <p id="upload-status" class="status-msg"></p>
      </form>
    </section>

    <!-- マイ動画タブ -->
    <section id="my-videos" class="tab-content" hidden>
      <div id="my-video-list" class="video-list"></div>
      <p id="my-empty" class="empty-msg" hidden>動画はまだありません</p>
    </section>
    <!-- 自習室タブ -->
    <section id="study-room" class="tab-content" hidden>
      <div id="sr-content">
        <!-- フォロー管理 -->
        <div class="sr-section">
          <h3 class="sr-heading">フォロー管理</h3>
          <div class="sr-follow-row">
            <select id="sr-follow-target">
              <option value="">フォローするユーザー</option>
            </select>
            <button id="sr-follow-btn" class="btn btn-primary">フォロー</button>
          </div>
          <p id="sr-follow-status" class="status-msg"></p>
        </div>

        <!-- フォロー中 / フォロワー -->
        <div class="sr-section">
          <div class="sr-tabs">
            <button class="sr-tab-btn active" data-sr-tab="following">フォロー中</button>
            <button class="sr-tab-btn" data-sr-tab="followers">フォロワー</button>
          </div>
          <div id="sr-following" class="sr-tab-content">
            <div id="sr-following-list" class="user-list"></div>
            <p id="sr-following-empty" class="empty-msg" hidden>まだ誰もフォローしていません</p>
          </div>
          <div id="sr-followers" class="sr-tab-content" hidden>
            <div id="sr-followers-list" class="user-list"></div>
            <p id="sr-followers-empty" class="empty-msg" hidden>フォロワーはいません</p>
          </div>
        </div>

        <!-- フォロー中の学習ログ -->
        <div class="sr-section">
          <h3 class="sr-heading">フォロー中の学習ログ</h3>
          <div id="sr-logs-list" class="log-list"></div>
          <p id="sr-logs-empty" class="empty-msg" hidden>学習ログはまだありません</p>
          <button id="sr-logs-more" class="btn" hidden>もっと見る</button>
        </div>
      </div>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
